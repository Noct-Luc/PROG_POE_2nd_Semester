
name: RaceDay Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test RaceDay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application project
        run: dotnet restore RaceDay.csproj

      - name: Restore test project
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build application
        run: dotnet build RaceDay.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
