name: Validate RaceDay Documents

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-documents:
    name: Validate Required Documents
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Check required directories
      # --------------------------------------------------

      - name: Check documentation directory
        run: |
          echo "Checking documentation directory..."

          if [ ! -d "docs" ]; then
            echo "::error::The docs directory does not exist."
            exit 1
          fi

          echo "✓ docs directory exists."


      # --------------------------------------------------
      # Check ERD
      # --------------------------------------------------

      - name: Validate ERD document
        run: |
          FILE="docs/RaceDay-ERD.pdf"

          if [ ! -f "$FILE" ]; then
            echo "::error::Missing ERD document: $FILE"
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "::error::ERD document is empty: $FILE"
            exit 1
          fi

          echo "✓ ERD document exists: $FILE"


      # --------------------------------------------------
      # Check SQL document
      # --------------------------------------------------

      - name: Validate SQL document
        run: |
          FILE="docs/RaceDay-SQL.sql"

          if [ ! -f "$FILE" ]; then
            echo "::error::Missing SQL document: $FILE"
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "::error::SQL document is empty: $FILE"
            exit 1
          fi

          echo "✓ SQL document exists: $FILE"


      # --------------------------------------------------
      # Check API endpoint plan
      # --------------------------------------------------

      - name: Validate API endpoint plan
        run: |
          FILE="docs/RaceDay-API-Endpoint-Plan.md"

          if [ ! -f "$FILE" ]; then
            echo "::error::Missing API endpoint plan: $FILE"
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "::error::API endpoint plan is empty: $FILE"
            exit 1
          fi

          echo "✓ API endpoint plan exists: $FILE"


      # --------------------------------------------------
      # Validate SQL content
      # --------------------------------------------------

      - name: Validate SQL content
        run: |
          FILE="docs/RaceDay-SQL.sql"

          echo "Checking SQL document contents..."

          required_content=(
            "CREATE DATABASE"
            "CREATE TABLE Users"
            "CREATE TABLE Participants"
            "CREATE TABLE Fees"
            "CREATE TABLE Teams"
            "CREATE TABLE Track"
            "CREATE TABLE Event"
            "CREATE TABLE TeamEvent"
            "INSERT INTO Users"
            "INSERT INTO Participants"
            "INSERT INTO Fees"
            "INSERT INTO Teams"
            "INSERT INTO Track"
            "INSERT INTO Event"
            "INSERT INTO TeamEvent"
          )

          for item in "${required_content[@]}"; do
            if ! grep -qi "$item" "$FILE"; then
              echo "::error::SQL document is missing: $item"
              exit 1
            fi

            echo "✓ Found: $item"
          done


      # --------------------------------------------------
      # Validate repository document list
      # --------------------------------------------------

      - name: Display required documents
        run: |
          echo ""
          echo "=========================================="
          echo "RaceDay Required Documents"
          echo "=========================================="

          echo "✓ docs/RaceDay-ERD.pdf"
          echo "✓ docs/RaceDay-SQL.sql"
          echo "✓ docs/RaceDay-API-Endpoint-Plan.md"

          echo ""
          echo "All required RaceDay documents are present."


      # --------------------------------------------------
      # Final result
      # --------------------------------------------------

      - name: Document validation successful
        run: |
          echo ""
          echo "=========================================="
          echo "DOCUMENT VALIDATION PASSED"
          echo "=========================================="
          echo ""
          echo "All required RaceDay documents are present"
          echo "and the SQL document contains the expected"
          echo "database entities and seed operations."
