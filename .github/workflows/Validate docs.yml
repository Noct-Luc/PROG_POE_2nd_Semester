name: RaceDay CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  DB_NAME: RaceDay
  DB_USER: sa
  DB_PASSWORD: "RaceDay_CI_Password123!"
  API_URL: http://localhost:5000

jobs:

  # =========================================================
  # DATABASE
  # =========================================================

  database:
    name: Database Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Start SQL Server
      # -------------------------------------------------------

      - name: Start SQL Server
        run: |
          docker run \
            --name raceday-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="${DB_PASSWORD}" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            -d \
            mcr.microsoft.com/mssql/server:2022-latest


      # -------------------------------------------------------
      # Wait for SQL Server
      # -------------------------------------------------------

      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server..."

          for i in {1..30}; do

            if docker exec raceday-sql \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U "$DB_USER" \
              -P "$DB_PASSWORD" \
              -C \
              -Q "SELECT 1" \
              > /dev/null 2>&1
            then
              echo "SQL Server is ready."
              exit 0
            fi

            sleep 2

          done

          echo "SQL Server failed to start."
          docker logs raceday-sql
          exit 1


      # -------------------------------------------------------
      # Create schema
      # -------------------------------------------------------

      - name: Create RaceDay database
        run: |
          docker cp database/schema.sql raceday-sql:/schema.sql

          docker exec raceday-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -i /schema.sql


      # -------------------------------------------------------
      # Seed database
      # -------------------------------------------------------

      - name: Seed RaceDay database
        run: |
          docker cp database/seed.sql raceday-sql:/seed.sql

          docker exec raceday-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -d "$DB_NAME" \
            -i /seed.sql


      # -------------------------------------------------------
      # Run database tests
      # -------------------------------------------------------

      - name: Run database tests
        run: |
          docker cp database/tests.sql raceday-sql:/tests.sql

          docker exec raceday-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -d "$DB_NAME" \
            -i /tests.sql


      # -------------------------------------------------------
      # Show database tables
      # -------------------------------------------------------

      - name: Display database tables
        run: |
          docker exec raceday-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -d "$DB_NAME" \
            -Q "
              SELECT TABLE_NAME
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_TYPE = 'BASE TABLE'
              ORDER BY TABLE_NAME;
            "


      # -------------------------------------------------------
      # Cleanup
      # -------------------------------------------------------

      - name: Stop SQL Server
        if: always()
        run: docker rm -f raceday-sql


  # =========================================================
  # API
  # =========================================================

  api:
    name: API Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Install .NET
      # -------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # -------------------------------------------------------
      # Restore
      # -------------------------------------------------------

      - name: Restore dependencies
        run: dotnet restore


      # -------------------------------------------------------
      # Build
      # -------------------------------------------------------

      - name: Build API
        run: |
          dotnet build \
            --no-restore \
            --configuration Release


      # -------------------------------------------------------
      # Unit tests
      # -------------------------------------------------------

      - name: Run unit tests
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --verbosity normal


      # -------------------------------------------------------
      # Publish
      # -------------------------------------------------------

      - name: Publish API
        run: |
          dotnet publish \
            --configuration Release \
            --output ./publish


  # =========================================================
  # API INTEGRATION / SMOKE TESTS
  # =========================================================

  api-smoke-tests:
    name: API Endpoint Tests
    runs-on: ubuntu-latest

    needs:
      - database
      - api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      - name: Restore dependencies
        run: dotnet restore


      - name: Build API
        run: |
          dotnet build \
            --configuration Release


      # -------------------------------------------------------
      # Start SQL Server
      # -------------------------------------------------------

      - name: Start SQL Server
        run: |
          docker run \
            --name raceday-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="${DB_PASSWORD}" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            -d \
            mcr.microsoft.com/mssql/server:2022-latest


      # -------------------------------------------------------
      # Wait for database
      # -------------------------------------------------------

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do

            if docker exec raceday-sql \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U "$DB_USER" \
              -P "$DB_PASSWORD" \
              -C \
              -Q "SELECT 1" \
              > /dev/null 2>&1
            then
              echo "SQL Server ready."
              exit 0
            fi

            sleep 2

          done

          exit 1


      # -------------------------------------------------------
      # Setup database
      # -------------------------------------------------------

      - name: Create database
        run: |
          docker cp database/schema.sql raceday-sql:/schema.sql

          docker exec raceday-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -i /schema.sql


      - name: Seed database
        run: |
          docker cp database/seed.sql raceday-sql:/seed.sql

          docker exec raceday-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -C \
            -d "$DB_NAME" \
            -i /seed.sql


      # -------------------------------------------------------
      # Start API
      # -------------------------------------------------------

      - name: Start API
        run: |
          nohup dotnet run \
            --project src/RaceDay.Api \
            --configuration Release \
            --urls "$API_URL" \
            > api.log 2>&1 &

          echo $! > api.pid


      # -------------------------------------------------------
      # Wait for API
      # -------------------------------------------------------

      - name: Wait for API
        run: |
          echo "Waiting for API..."

          for i in {1..30}; do

            if curl \
              --silent \
              --fail \
              "$API_URL/api/users" \
              > /dev/null
            then
              echo "API is ready."
              exit 0
            fi

            sleep 2

          done

          echo "API failed to start."
          cat api.log
          exit 1


      # =======================================================
      # USERS API
      # =======================================================

      - name: GET /api/users
        run: |
          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$API_URL/api/users")

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"


      - name: GET /api/users/101
        run: |
          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$API_URL/api/users/101")

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"


      - name: GET missing user
        run: |
          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$API_URL/api/users/9999")

          echo "HTTP status: $STATUS"

          test "$STATUS" = "404"


      # =======================================================
      # PARTICIPANTS API
      # =======================================================

      - name: GET /api/participants
        run: |
          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$API_URL/api/participants")

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"


      - name: GET /api/participants/201
        run: |
          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$API_URL/api/participants/201")

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"


      # =======================================================
      # CLEANUP
      # =======================================================

      - name: Display API logs
        if: always()
        run: |
          cat api.log || true


      - name: Stop SQL Server
        if: always()
        run: |
          docker rm -f raceday-sql || true
