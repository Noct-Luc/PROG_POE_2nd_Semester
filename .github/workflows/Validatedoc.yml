name: Validate Repository Documentation Structure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation Folder and Submissions
        run: |
          echo "Starting CI/CD validation check..."

          # 1. Locate docs or Docs folder dynamically
          DOCS_DIR=""
          if [ -d "docs" ]; then
            DOCS_DIR="docs"
          elif [ -d "Docs" ]; then
            DOCS_DIR="Docs"
          else
            echo "::error:: Neither '/docs' nor '/Docs' folder exists at the root level. Please create a 'docs' folder and put your files inside it."
            exit 1
          fi

          echo "Found documentation folder at: ./$DOCS_DIR"

          # 2. Check for API Plan Markdown File (case-insensitive search)
          API_FILE=$(find "$DOCS_DIR" -maxdepth 1 -type f \( -iname "*api*plan*.md" -o -iname "*endpoint*.md" \) | head -n 1)
          if [ -z "$API_FILE" ]; then
            echo "::error:: API Plan file (e.g. API_Endpoint_Plan.md or API_Plan.md) is missing in /$DOCS_DIR!"
            exit 1
          else
            echo "✔ Found API Plan: $API_FILE"
          fi

          # 3. Check for SQL Script (case-insensitive search)
          SQL_FILE=$(find "$DOCS_DIR" -maxdepth 1 -type f -iname "*.sql" | head -n 1)
          if [ -z "$SQL_FILE" ]; then
            echo "::error:: SQL database script (e.g. RaceDay.sql) is missing in /$DOCS_DIR!"
            exit 1
          else
            echo "✔ Found SQL file: $SQL_FILE"
          fi

          # 4. Check for ERD Image (case-insensitive search for image files)
          ERD_FILE=$(find "$DOCS_DIR" -maxdepth 1 -type f \( -iname "*erd*" -o -iname "*diagram*" \) \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) | head -n 1)
          if [ -z "$ERD_FILE" ]; then
            echo "::error:: ERD Image (e.g. RaceDay_ERD.png) is missing in /$DOCS_DIR!"
            exit 1
          else
            echo "✔ Found ERD image: $ERD_FILE"
          fi

          echo "SUCCESS: All required planning documents exist!"
